apiVersion: v1
kind: ServiceAccount
metadata:
  name: symphony-autoscaler
  namespace: symphony
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: symphony-autoscaler
  namespace: symphony
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets/scale"]
    resourceNames: ["symphony-worker"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: symphony-autoscaler
  namespace: symphony
subjects:
  - kind: ServiceAccount
    name: symphony-autoscaler
    namespace: symphony
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: symphony-autoscaler
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: symphony-autoscaler
  namespace: symphony
  labels:
    app: symphony-autoscaler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: symphony-autoscaler
  template:
    metadata:
      labels:
        app: symphony-autoscaler
    spec:
      serviceAccountName: symphony-autoscaler
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: autoscaler
          image: ghcr.io/jasonmorganson/symphony-k8s-autoscaler@sha256:b90c816a1274e78153158d573ed8238cf59356a924936e7ff34d631088ec78de
          imagePullPolicy: Always
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: STATEFULSET_NAME
              value: symphony-worker
            - name: WORKER_POD_SELECTOR
              value: app=symphony-worker
            - name: SYMPHONY_STATE_URL
              value: http://symphony-orchestrator:4000/api/v1/state
            - name: SYMPHONY_DRAINS_URL
              value: http://symphony-orchestrator:4000/api/v1/worker-drains
            - name: SYMPHONY_WORKER_DRAIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: symphony-secrets
                  key: SYMPHONY_WORKER_DRAIN_TOKEN
            - name: MIN_WORKERS
              value: "0"
            - name: MAX_WORKERS
              value: "10"
            - name: AGENTS_PER_WORKER
              value: "1"
            - name: POLL_INTERVAL_SECONDS
              value: "15"
            - name: SCALE_DOWN_STABILIZATION_SECONDS
              value: "90"
            - name: DEMAND_MAX_AGE_SECONDS
              value: "300"
            - name: RETRY_WARMUP_SECONDS
              value: "120"
          ports:
            - name: metrics
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 15
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: symphony-autoscaler
  namespace: symphony
spec:
  selector:
    app: symphony-autoscaler
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
