apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: symphony-worker
  namespace: symphony
  labels:
    app: symphony-worker
spec:
  serviceName: symphony-worker
  podManagementPolicy: Parallel
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: symphony-worker
  template:
    metadata:
      labels:
        app: symphony-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: init-worker-hostkeys
          image: busybox:1.36
          command: [sh, -c, "cp /ssh-src/* /ssh-dst/ && chmod 600 /ssh-dst/ssh_host_ed25519_key && chmod 644 /ssh-dst/ssh_host_ed25519_key.pub"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: worker-hostkeys-secret
              mountPath: /ssh-src
              readOnly: true
            - name: worker-hostkeys
              mountPath: /ssh-dst
      containers:
        - name: worker
          image: symphony-worker
          imagePullPolicy: IfNotPresent
          ports:
            - name: ssh
              containerPort: 22
          startupProbe:
            exec:
              command: [sh, -c, "test -f /run/symphony-worker-ready"]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [sh, -c, "test -f /run/symphony-worker-ready"]
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 30
          env:
            - name: GITHUB_MACHINE_LOGIN
              value: autograph-symphony
            - name: GITHUB_MACHINE_NAME
              value: autograph-symphony
            - name: GITHUB_MACHINE_EMAIL
              value: jason+symphony@withgraph.com
            - name: LINEAR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: symphony-secrets
                  key: LINEAR_API_KEY
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-machine-arrusted-symphony
                  key: token
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: workspaces
              mountPath: /srv/symphony/workspaces
            - name: codex-home
              mountPath: /home/symphony/.codex
            - name: codex-chatgpt-auth
              mountPath: /etc/symphony/codex-auth
              readOnly: true
            - name: tool-state
              mountPath: /home/symphony/.local
            - name: package-cache
              mountPath: /home/symphony/.cache
            - name: cargo-cache
              mountPath: /home/symphony/.cargo
            - name: bun-cache
              mountPath: /home/symphony/.bun
            - name: worker-hostkeys
              mountPath: /etc/ssh/keys
              readOnly: true
            - name: worker-authorized-keys
              mountPath: /etc/ssh/authorized-keys/authorized_keys
              subPath: authorized_keys
              readOnly: true
      volumes:
        - name: workspaces
          emptyDir: {}
        - name: codex-home
          emptyDir: {}
        - name: tool-state
          emptyDir: {}
        - name: package-cache
          emptyDir: {}
        - name: cargo-cache
          emptyDir: {}
        - name: bun-cache
          emptyDir: {}
        - name: codex-chatgpt-auth
          secret:
            secretName: codex-chatgpt-auth
            defaultMode: 0400
        - name: worker-hostkeys-secret
          secret:
            secretName: symphony-worker-hostkeys
            defaultMode: 0600
        - name: worker-hostkeys
          emptyDir: {}
        - name: worker-authorized-keys
          secret:
            secretName: symphony-worker-authorized-keys
            defaultMode: 0400
