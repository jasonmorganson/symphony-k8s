apiVersion: apps/v1
kind: Deployment
metadata:
  name: symphony-orchestrator
  namespace: symphony
  labels:
    app: symphony-orchestrator
spec:
  replicas: 1
  progressDeadlineSeconds: 2100
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: symphony-orchestrator
  template:
    metadata:
      labels:
        app: symphony-orchestrator
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-orchestrator-ssh
          image: busybox:1.36
          command: [sh, -c]
          args:
            - |
              cp /ssh-src/* /ssh-dst/
              cat >>/ssh-dst/config <<'EOF'

              Host *
                BatchMode yes
                ConnectTimeout 10
                ServerAliveInterval 10
                ServerAliveCountMax 3
              EOF
              chmod 600 /ssh-dst/id_ed25519
              chmod 644 /ssh-dst/known_hosts /ssh-dst/config
              chown -R 10001:10001 /ssh-dst
              cp /workflow/WORKFLOW.md /runtime/WORKFLOW.md
              chown 10001:10001 /runtime/WORKFLOW.md
              chmod 0400 /runtime/WORKFLOW.md
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: orchestrator-ssh-secret
              mountPath: /ssh-src
              readOnly: true
            - name: orchestrator-ssh
              mountPath: /ssh-dst
            - name: workflow
              mountPath: /workflow
              readOnly: true
            - name: workspaces
              mountPath: /runtime
      containers:
        - name: orchestrator
          image: symphony-orchestrator
          imagePullPolicy: IfNotPresent
          workingDir: /srv/symphony/workspaces
          args:
            - start
          ports:
            - name: http
              containerPort: 4000
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 360
            periodSeconds: 5
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - kill -0 1
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 3Gi
            limits:
              cpu: "1"
              memory: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          env:
            - name: LANG
              value: C.UTF-8
            - name: ELIXIR_ERL_OPTIONS
              value: +fnu
          envFrom:
            - secretRef:
                name: symphony-secrets
          volumeMounts:
            - name: workflow
              mountPath: /etc/symphony-workflow
              readOnly: true
            - name: workspaces
              mountPath: /srv/symphony/workspaces
            - name: orchestrator-ssh
              mountPath: /home/symphony/.ssh
              readOnly: true
        - name: dashboard-proxy
          image: alpine/socat:1.8.0.3
          args: ["TCP-LISTEN:4000,fork,reuseaddr", "TCP:127.0.0.1:4001"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
      volumes:
        - name: workflow
          configMap:
            name: symphony-workflow
        - name: workspaces
          emptyDir: {}
        - name: orchestrator-ssh
          emptyDir: {}
        - name: orchestrator-ssh-secret
          secret:
            secretName: symphony-orchestrator-ssh
            defaultMode: 0400
