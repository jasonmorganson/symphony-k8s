name: Reconcile Symphony production

on:
  push:
    branches: [master]
    paths:
      - environments/production/**
      - k8s/**
      - scripts/reconcile-production.sh
      - scripts/render-*.rb
      - scripts/render-production.sh
      - .github/workflows/reconcile-production.yml
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-symphony-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://symphony.morganson.me
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pin
        run: echo "workflow=$(ruby -ryaml -e 'print YAML.safe_load(File.read(ARGV[0])).dig("spec","workflow","revision")' environments/production/desired-state.yaml)" >> "$GITHUB_OUTPUT"
      - name: Require private workflow repository credential
        env:
          ARRUSTED_REPOSITORY_TOKEN: ${{ secrets.ARRUSTED_REPOSITORY_TOKEN }}
        run: test -n "$ARRUSTED_REPOSITORY_TOKEN"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: withAutograph/arrusted-development
          ref: ${{ steps.pin.outputs.workflow }}
          path: .production/workflow
          token: ${{ secrets.ARRUSTED_REPOSITORY_TOKEN }}
      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Fetch short-lived cluster credentials
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 1800 symphony-k8s >/dev/null
      - name: Install Kustomize
        run: |
          bash scripts/install-kustomize.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Reconcile committed production state
        run: bash scripts/reconcile-production.sh environments/production/desired-state.yaml .production/workflow
