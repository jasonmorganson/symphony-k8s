name: Publish immutable Symphony images

on:
  push:
    branches: [master]
    paths:
      - docker/**
      - docker-bake.hcl
      - environments/production/desired-state.yaml
      - .github/workflows/publish-images.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: publish-symphony-images
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether publication is required
        id: plan
        shell: bash
        run: |
          desired="$(ruby -ryaml -e 'print YAML.safe_load(File.read(ARGV[0])).dig("spec","symphony","revision")' environments/production/desired-state.yaml)"
          built="$(ruby -ryaml -e 'print YAML.safe_load(File.read(ARGV[0])).dig("spec","images","built_from_symphony_revision")' environments/production/desired-state.yaml)"
          publish=false
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || "$desired" != "$built" ]]; then
            publish=true
          elif git diff --name-only HEAD^ HEAD | grep -Eq '^(docker/|docker-bake\.hcl$|\.github/workflows/publish-images\.yml$)'; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - id: pin
        run: echo "revision=$(ruby -ryaml -e 'print YAML.safe_load(File.read(ARGV[0])).dig("spec","symphony","revision")' environments/production/desired-state.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v4.2.0
        if: steps.plan.outputs.publish == 'true'
      - uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        if: steps.plan.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish content-addressed images
        if: steps.plan.outputs.publish == 'true'
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          push: true
          targets: orchestrator,worker
          set: |
            release.args.SYMPHONY_COMMIT=${{ steps.pin.outputs.revision }}
            orchestrator.tags=ghcr.io/jasonmorganson/symphony-k8s-orchestrator:${{ github.sha }}
            worker.tags=ghcr.io/jasonmorganson/symphony-k8s-worker:${{ github.sha }}
      - name: Resolve immutable digests
        if: steps.plan.outputs.publish == 'true'
        id: images
        run: |
          orchestrator_digest="$(docker buildx imagetools inspect "ghcr.io/jasonmorganson/symphony-k8s-orchestrator:${GITHUB_SHA}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          worker_digest="$(docker buildx imagetools inspect "ghcr.io/jasonmorganson/symphony-k8s-worker:${GITHUB_SHA}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "orchestrator=ghcr.io/jasonmorganson/symphony-k8s-orchestrator@${orchestrator_digest}" >> "$GITHUB_OUTPUT"
          echo "worker=ghcr.io/jasonmorganson/symphony-k8s-worker@${worker_digest}" >> "$GITHUB_OUTPUT"
      - name: Open desired-state digest update
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ORCHESTRATOR_IMAGE: ${{ steps.images.outputs.orchestrator }}
          WORKER_IMAGE: ${{ steps.images.outputs.worker }}
          SYMPHONY_REVISION: ${{ steps.pin.outputs.revision }}
        run: |
          branch="automation/images-${GITHUB_SHA::12}"
          git switch -c "$branch"
          ruby scripts/update-image-digests.rb environments/production/desired-state.yaml "$SYMPHONY_REVISION" "$ORCHESTRATOR_IMAGE" "$WORKER_IMAGE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add environments/production/desired-state.yaml
          git commit -m "Pin immutable Symphony images"
          git push origin "$branch"
          gh pr create --base master --head "$branch" --title "Pin immutable Symphony images" --body "Pins images built from Symphony $SYMPHONY_REVISION. Production reconciliation remains blocked until this reviewed desired-state change merges."
          gh workflow run validate.yml --ref "$branch"
