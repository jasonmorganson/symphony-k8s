name: Diagnose Symphony production

on:
  schedule:
    # A failed run is the low-risk alert surface: GitHub Actions reports the
    # scheduled workflow failure without granting an in-cluster identity.
    - cron: "43 * * * *"
  workflow_dispatch:
    inputs:
      probe_codex:
        description: Run one minimal read-only Codex request on every worker
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://symphony.morganson.me
    concurrency:
      group: production-doks-diagnostics
      cancel-in-progress: false
    steps:
      - uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Fetch short-lived cluster credentials
        run: |
          doctl kubernetes cluster kubeconfig save \
            --expiry-seconds 600 \
            symphony-k8s >/dev/null
      - name: Monitor production health
        run: bash scripts/monitor-production.sh
      - name: Collect non-secret runtime diagnostics
        if: always()
        run: |
          set -euo pipefail

          kubectl -n symphony get deployment,statefulset,pods -o wide
          kubectl -n symphony get pods -o json | jq '{
            pods: [
              .items[] |
              {
                name: .metadata.name,
                phase: .status.phase,
                node: .spec.nodeName,
                conditions: [
                  .status.conditions[]? |
                  select(.type == "Ready" or .type == "PodScheduled") |
                  {type, status, reason, message}
                ],
                containers: [
                  .status.containerStatuses[]? |
                  {
                    name,
                    ready,
                    restartCount,
                    state,
                    lastState
                  }
                ]
              }
            ]
          }'
          kubectl -n symphony get events \
            --sort-by=.metadata.creationTimestamp \
            --field-selector type=Warning

          echo "Current orchestrator logs"
          kubectl -n symphony logs deployment/symphony-orchestrator \
            --since=20m \
            --tail=2000 2>&1 |
            sed -E \
              -e 's/((token|secret|password|authorization|cookie)[=:][[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig' \
              -e 's/(Bearer[[:space:]]+)[^[:space:]]+/\1[REDACTED]/Ig' ||
            true

          for worker in $(kubectl -n symphony get pods \
            -l app=symphony-worker \
            -o name); do
            echo "Recent logs for ${worker}"
            kubectl -n symphony logs "$worker" \
              --since=20m \
              --tail=200 2>&1 |
              sed -E \
                -e 's/((token|secret|password|authorization|cookie)[=:][[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig' \
                -e 's/(Bearer[[:space:]]+)[^[:space:]]+/\1[REDACTED]/Ig' ||
              true
          done

          echo "Previous orchestrator logs"
          kubectl -n symphony logs deployment/symphony-orchestrator \
            --previous \
            --tail=200 2>&1 |
            sed -E \
              -e 's/((token|secret|password|authorization|cookie)[=:][[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig' \
              -e 's/(Bearer[[:space:]]+)[^[:space:]]+/\1[REDACTED]/Ig' ||
            true
      - name: Probe worker Codex sessions
        if: inputs.probe_codex
        run: |
          set -euo pipefail
          status=0
          pids=()

          for worker in $(kubectl -n symphony get pods \
            -l app=symphony-worker \
            -o name); do
            (
              echo "Probing ${worker}"
              kubectl -n symphony exec "$worker" -- \
                timeout 45s \
                runuser -u symphony -- \
                env HOME=/home/symphony \
                codex exec \
                  --skip-git-repo-check \
                  --sandbox read-only \
                  --color never \
                  "Reply with exactly OK."
            ) >"${RUNNER_TEMP}/${worker##*/}.log" 2>&1 &
            pids+=("$!")
          done

          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then
              status=1
            fi
          done
          for log in "${RUNNER_TEMP}"/symphony-worker-*.log; do
            sed -E \
              -e 's/((token|secret|password|authorization|cookie)[=:][[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig' \
              -e 's/(Bearer[[:space:]]+)[^[:space:]]+/\1[REDACTED]/Ig' \
              "$log"
          done
          exit "$status"
