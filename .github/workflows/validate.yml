name: Validate GitOps desired state

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read pinned revisions
        id: pins
        run: |
          {
            echo "symphony=$(ruby -ryaml -e 'print YAML.safe_load(File.read(ARGV[0])).dig("spec","symphony","revision")' environments/production/desired-state.yaml)"
            echo "symphony_upstream=$(ruby -ryaml -e 'print YAML.safe_load(File.read(ARGV[0])).dig("spec","symphony","upstream_revision")' environments/production/desired-state.yaml)"
            echo "workflow=$(ruby -ryaml -e 'print YAML.safe_load(File.read(ARGV[0])).dig("spec","workflow","revision")' environments/production/desired-state.yaml)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jasonmorganson/symphony
          ref: ${{ steps.pins.outputs.symphony }}
          path: .validation/symphony
          fetch-depth: 0
      - name: Register upstream Symphony
        run: git -C .validation/symphony remote add upstream https://github.com/openai/symphony.git
      - name: Require private workflow repository credential
        env:
          ARRUSTED_REPOSITORY_TOKEN: ${{ secrets.ARRUSTED_REPOSITORY_TOKEN }}
        run: test -n "$ARRUSTED_REPOSITORY_TOKEN"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: withAutograph/arrusted-development
          ref: ${{ steps.pins.outputs.workflow }}
          path: .validation/workflow
          token: ${{ secrets.ARRUSTED_REPOSITORY_TOKEN }}
          fetch-depth: 1
      - name: Install Kustomize
        run: |
          bash scripts/install-kustomize.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Prove upstream-equivalent Symphony
        run: bash scripts/verify-symphony-upstream.sh .validation/symphony "${{ steps.pins.outputs.symphony }}" "${{ steps.pins.outputs.symphony_upstream }}"
      - name: Validate runtime workflow projection
        run: ruby tests/test-runtime-workflow-renderer.rb
      - name: Reject unsafe desired state
        run: ruby tests/test-desired-state-rejections.rb
      - name: Validate scale-down guard
        run: ruby tests/test-scale-down.rb
      - name: Validate image provenance guard
        run: bash tests/test-reconcile-provenance.sh
      - name: Render complete production manifests
        env:
          ARRUSTED_WORKFLOW_CHECKOUT: ${{ github.workspace }}/.validation/workflow
        run: bash tests/test-production-render.sh
      - name: Validate shell and manifests
        run: |
          bash -n scripts/*.sh docker/*/*.sh tests/*.sh
          bash tests/test-worker-auth.sh
          bash tests/test-worker-image-contract.sh
          KUSTOMIZE='kustomize build' bash tests/test-kustomize-boundaries.sh
          git diff --check
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v4.2.0
      - name: Build deployment images
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          source: .
          load: true
          targets: orchestrator,worker
          set: |
            release.args.SYMPHONY_COMMIT=${{ steps.pins.outputs.symphony }}
            orchestrator.tags=symphony-orchestrator:test
            worker.tags=symphony-worker:test
      - name: Smoke-test worker utilities
        run: bash tests/test-worker-image-contract.sh symphony-worker:test
