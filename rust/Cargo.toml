[package]
name = "symphony-control-plane"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.100"
axum = "0.8.9"
chrono = { version = "0.4.42", features = ["serde"] }
futures = "0.3.31"
k8s-openapi = { version = "=0.28.0", features = ["v1_36"] }
kube = { version = "=4.2.0", features = ["runtime"] }
prometheus-client = "0.25.0"
regex = "1.12.2"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
http = "1.4.0"
tempfile = "3.24.0"
tower-test = "0.4.0"

[[bin]]
name = "symphony-autoscaler"
path = "src/bin/autoscaler.rs"

[[bin]]
name = "symphony-workspace-reclaimer"
path = "src/bin/workspace_reclaimer.rs"
