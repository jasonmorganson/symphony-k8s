apiVersion: symphony.morganson.me/v1alpha1
kind: SymphonyEnvironment
metadata:
  name: production
spec:
  namespace: symphony
  symphony:
    repository: https://github.com/jasonmorganson/symphony.git
    revision: bebfcea85208df81d1692b868e79195e0ddad3fb
    upstream_repository: https://github.com/openai/symphony.git
    upstream_revision: f8e8b8a670c799f6e0ade7a8c25c4bf4a4a56ec7
  workflow:
    repository: https://github.com/withAutograph/arrusted-development.git
    path: WORKFLOW.md
    revision: 1fcf112f5d3bb2643d4cdcf44221b4719c2e40b8
  images:
    built_from_symphony_revision: bebfcea85208df81d1692b868e79195e0ddad3fb
    orchestrator: ghcr.io/jasonmorganson/symphony-k8s-orchestrator@sha256:ef610d23925490f3772f4e53bfc3c8f05149fd68528ce46d0339887196520385
    worker: ghcr.io/jasonmorganson/symphony-k8s-worker@sha256:5c45264b856b550f018255a54b93587b9cfb3371fa8cec0d914c665a301a9f14
  workers:
    replicas: 10
    capacity_per_worker: 1
    workspace_root: /srv/symphony/workspaces
    resources:
      requests:
        cpu: "2"
        memory: 4Gi
      limits:
        cpu: "4"
        memory: 6Gi
    node_selector:
      doks.digitalocean.com/node-pool: symphony-ha
  orchestrator:
    resources:
      requests:
        cpu: 100m
        memory: 3Gi
      limits:
        cpu: "1"
        memory: 6Gi
    node_selector:
      doks.digitalocean.com/node-pool: symphony-control
  server:
    host: 0.0.0.0
    port: 4001
  secrets:
    references:
      - symphony-secrets
      - symphony-orchestrator-ssh
      - symphony-worker-authorized-keys
      - symphony-worker-hostkeys
      - github-machine-arrusted-symphony
      - codex-chatgpt-auth
      - cloudflare-tunnel-token
  networking:
    cloudflare_tunnel_secret: cloudflare-tunnel-token
