apiVersion: symphony.morganson.me/v1alpha1
kind: SymphonyEnvironment
metadata:
  name: production
spec:
  namespace: symphony
  symphony:
    repository: https://github.com/jasonmorganson/symphony.git
    revision: 67c1cd54a298d072a9a522f1df54f9b915d8e8ee
    upstream_repository: https://github.com/openai/symphony.git
    upstream_revision: f8e8b8a670c799f6e0ade7a8c25c4bf4a4a56ec7
  workflow:
    repository: https://github.com/withAutograph/arrusted-development.git
    path: WORKFLOW.md
    revision: d44b6a22c01d3cc1c685d0e10f1f1a24322fa2c4
  images:
    built_from_symphony_revision: 67c1cd54a298d072a9a522f1df54f9b915d8e8ee
    orchestrator: ghcr.io/jasonmorganson/symphony-k8s-orchestrator@sha256:f66b045ee57374eec1dc0add6219c250cc76b7af4931c73d1a08db1359834cb5
    worker: ghcr.io/jasonmorganson/symphony-k8s-worker@sha256:9c9c3e4d41b42fd314d24519e66f9aa8b6b5d769d2f19fdd5bb0e38c89b38d9c
  workers:
    replicas: 7
    capacity_per_worker: 1
    workspace_root: /srv/symphony/workspaces
    resources:
      requests:
        cpu: "2"
        memory: 4Gi
      limits:
        cpu: "4"
        memory: 6Gi
    node_selector:
      doks.digitalocean.com/node-pool: symphony-ha
  orchestrator:
    resources:
      requests:
        cpu: "2"
        memory: 3Gi
      limits:
        cpu: "4"
        memory: 6Gi
    node_selector:
      doks.digitalocean.com/node-pool: symphony-control
  server:
    host: 0.0.0.0
    port: 4001
  secrets:
    references:
      - symphony-secrets
      - symphony-orchestrator-ssh
      - symphony-worker-authorized-keys
      - symphony-worker-hostkeys
      - github-machine-arrusted-symphony
      - codex-chatgpt-auth
      - cloudflare-tunnel-token
  networking:
    cloudflare_tunnel_secret: cloudflare-tunnel-token
