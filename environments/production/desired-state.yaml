apiVersion: symphony.morganson.me/v1alpha1
kind: SymphonyEnvironment
metadata:
  name: production
spec:
  namespace: symphony
  symphony:
    repository: https://github.com/jasonmorganson/symphony.git
    revision: c5fdae0c0bbfa58920db7ac5c90a4f0d2412fc50
    upstream_repository: https://github.com/openai/symphony.git
    upstream_revision: f8e8b8a670c799f6e0ade7a8c25c4bf4a4a56ec7
  workflow:
    repository: https://github.com/withAutograph/arrusted-development.git
    path: WORKFLOW.md
    revision: 77a38fdfca7133582665bdcbc2dcebdd97f21d60
  images:
    built_from_symphony_revision: c5fdae0c0bbfa58920db7ac5c90a4f0d2412fc50
    orchestrator: ghcr.io/jasonmorganson/symphony-k8s-orchestrator@sha256:aaa15e7f1f67c79537a36990401263f5d6adc456d6202f76f2469d33584c7e56
    worker: ghcr.io/jasonmorganson/symphony-k8s-worker@sha256:ce1c9d55eb428b78f21b484287293d3bbcecc08db53e2fbf88645708ce1b1a57
  workers:
    replicas: 7
    capacity_per_worker: 1
    workspace_root: /srv/symphony/workspaces
    resources:
      requests:
        cpu: "2"
        memory: 4Gi
      limits:
        cpu: "4"
        memory: 6Gi
    node_selector:
      doks.digitalocean.com/node-pool: symphony-ha
  orchestrator:
    resources:
      requests:
        cpu: 100m
        memory: 3Gi
      limits:
        cpu: "1"
        memory: 6Gi
    node_selector:
      doks.digitalocean.com/node-pool: symphony-control
  server:
    host: 0.0.0.0
    port: 4001
  secrets:
    references:
      - symphony-secrets
      - symphony-orchestrator-ssh
      - symphony-worker-authorized-keys
      - symphony-worker-hostkeys
      - github-machine-arrusted-symphony
      - codex-chatgpt-auth
      - cloudflare-tunnel-token
  networking:
    cloudflare_tunnel_secret: cloudflare-tunnel-token
