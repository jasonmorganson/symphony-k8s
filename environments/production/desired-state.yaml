apiVersion: symphony.morganson.me/v1alpha1
kind: SymphonyEnvironment
metadata:
  name: production
spec:
  namespace: symphony
  symphony:
    repository: https://github.com/jasonmorganson/symphony.git
    revision: 3b8ec8e5d3f91dafd188f798c4b99466d794d872
    upstream_repository: https://github.com/openai/symphony.git
    upstream_revision: f8e8b8a670c799f6e0ade7a8c25c4bf4a4a56ec7
  workflow:
    repository: https://github.com/withAutograph/arrusted-development.git
    path: WORKFLOW.md
    revision: 71b8ae3ab04d213401c82f4445df5966bbd747bc
  images:
    built_from_symphony_revision: 3b8ec8e5d3f91dafd188f798c4b99466d794d872
    orchestrator: ghcr.io/jasonmorganson/symphony-k8s-orchestrator@sha256:2f8c89aacea30c9271b9d9df56de09b6b437adc70066629967274ff613a8195e
    worker: ghcr.io/jasonmorganson/symphony-k8s-worker@sha256:6d01ce25f1c1db25d9de77eb6c0e59551e5b444aeb143ed2c51de34a3d89aca3
  workers:
    replicas: 3
    capacity_per_worker: 1
    workspace_root: /srv/symphony/workspaces
    resources:
      requests:
        cpu: "2"
        memory: 4Gi
      limits:
        cpu: "4"
        memory: 6Gi
    node_selector:
      doks.digitalocean.com/node-pool: symphony-ha
    node_pool:
      min_nodes: 0
      max_nodes: 3
  orchestrator:
    resources:
      requests:
        cpu: "2"
        memory: 3Gi
      limits:
        cpu: "4"
        memory: 6Gi
    node_selector:
      doks.digitalocean.com/node-pool: symphony-control
  server:
    host: 0.0.0.0
    port: 4001
  secrets:
    references:
      - symphony-secrets
      - symphony-orchestrator-ssh
      - symphony-worker-authorized-keys
      - symphony-worker-hostkeys
      - github-machine-arrusted-symphony
      - codex-chatgpt-auth
      - cloudflare-tunnel-token
  networking:
    cloudflare_tunnel_secret: cloudflare-tunnel-token
