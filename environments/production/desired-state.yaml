apiVersion: symphony.morganson.me/v1alpha1
kind: SymphonyEnvironment
metadata:
  name: production
spec:
  namespace: symphony
  symphony:
    repository: https://github.com/jasonmorganson/symphony.git
    revision: 2be7cc3a89e886041e4289450d9a956a22922fd3
    upstream_repository: https://github.com/openai/symphony.git
    upstream_revision: f8e8b8a670c799f6e0ade7a8c25c4bf4a4a56ec7
  workflow:
    repository: https://github.com/withAutograph/arrusted-development.git
    path: WORKFLOW.md
    revision: e130ab5e38ad89ee1c3503b38836a91a0731d741
  images:
    built_from_symphony_revision: 2be7cc3a89e886041e4289450d9a956a22922fd3
    orchestrator: ghcr.io/jasonmorganson/symphony-k8s-orchestrator@sha256:b14f3e2c2bf54324dc486c58bb128e36948c4f1bffd31f47a01c6f6661bde4c3
    worker: ghcr.io/jasonmorganson/symphony-k8s-worker@sha256:df488d8c5687d85927c39128a270ec1ed65ba2aab8c4c5880e66ec815c459811
  workers:
    replicas: 7
    capacity_per_worker: 1
    workspace_root: /srv/symphony/workspaces
    resources:
      requests:
        cpu: "2"
        memory: 4Gi
      limits:
        cpu: "4"
        memory: 6Gi
    node_selector:
      doks.digitalocean.com/node-pool: symphony-ha
  orchestrator:
    resources:
      requests:
        cpu: 100m
        memory: 3Gi
      limits:
        cpu: "1"
        memory: 6Gi
    node_selector:
      doks.digitalocean.com/node-pool: symphony-control
  server:
    host: 0.0.0.0
    port: 4001
  secrets:
    references:
      - symphony-secrets
      - symphony-orchestrator-ssh
      - symphony-worker-authorized-keys
      - symphony-worker-hostkeys
      - github-machine-arrusted-symphony
      - codex-chatgpt-auth
      - cloudflare-tunnel-token
  networking:
    cloudflare_tunnel_secret: cloudflare-tunnel-token
