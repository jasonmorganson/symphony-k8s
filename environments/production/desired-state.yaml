apiVersion: symphony.morganson.me/v1alpha1
kind: SymphonyEnvironment
metadata:
  name: production
spec:
  namespace: symphony
  symphony:
    repository: https://github.com/jasonmorganson/symphony.git
    revision: bd77c48d5800e9a849eeb2bf2aa29cf06abb121e
    upstream_repository: https://github.com/openai/symphony.git
    upstream_revision: f8e8b8a670c799f6e0ade7a8c25c4bf4a4a56ec7
  workflow:
    repository: https://github.com/withAutograph/arrusted-development.git
    path: WORKFLOW.md
    revision: d44b6a22c01d3cc1c685d0e10f1f1a24322fa2c4
  images:
    built_from_symphony_revision: bd77c48d5800e9a849eeb2bf2aa29cf06abb121e
    orchestrator: ghcr.io/jasonmorganson/symphony-k8s-orchestrator@sha256:a102715003173717f17b17cacd74cfc41275b4ded7738f1bd1713b912d1d3254
    worker: ghcr.io/jasonmorganson/symphony-k8s-worker@sha256:1a72392f97acd2acdfe1e520a39456b3d916d918b122f0011fff646887994ae8
  workers:
    replicas: 7
    capacity_per_worker: 1
    workspace_root: /srv/symphony/workspaces
    resources:
      requests:
        cpu: "2"
        memory: 4Gi
      limits:
        cpu: "4"
        memory: 6Gi
    node_selector:
      doks.digitalocean.com/node-pool: symphony-ha
  orchestrator:
    resources:
      requests:
        cpu: "2"
        memory: 3Gi
      limits:
        cpu: "4"
        memory: 6Gi
    node_selector:
      doks.digitalocean.com/node-pool: symphony-control
  server:
    host: 0.0.0.0
    port: 4001
  secrets:
    references:
      - symphony-secrets
      - symphony-orchestrator-ssh
      - symphony-worker-authorized-keys
      - symphony-worker-hostkeys
      - github-machine-arrusted-symphony
      - codex-chatgpt-auth
      - cloudflare-tunnel-token
  networking:
    cloudflare_tunnel_secret: cloudflare-tunnel-token
