apiVersion: symphony.morganson.me/v1alpha1
kind: SymphonyEnvironment
metadata:
  name: production
spec:
  namespace: symphony
  symphony:
    repository: https://github.com/jasonmorganson/symphony.git
    revision: 9515948fe3644dd6f7a64e4a51f386f91e455e66
    upstream_repository: https://github.com/openai/symphony.git
    upstream_revision: f8e8b8a670c799f6e0ade7a8c25c4bf4a4a56ec7
  workflow:
    repository: https://github.com/withAutograph/arrusted-development.git
    path: WORKFLOW.md
    revision: e130ab5e38ad89ee1c3503b38836a91a0731d741
  images:
    built_from_symphony_revision: 5b8d49a8a853f729f7577e32ba095f76828ec9b1
    orchestrator: ghcr.io/jasonmorganson/symphony-k8s-orchestrator@sha256:68bf9f6f6a4ac275eaf9e27163795f18a09877b29e74d317896f7e40874ee0b2
    worker: ghcr.io/jasonmorganson/symphony-k8s-worker@sha256:e14fa8ed48f5af20998120dc032c890a633f01cc7ffa8d4a482950faf5c46859
  workers:
    replicas: 7
    capacity_per_worker: 1
    workspace_root: /srv/symphony/workspaces
    resources:
      requests:
        cpu: "2"
        memory: 4Gi
      limits:
        cpu: "4"
        memory: 6Gi
    node_selector:
      doks.digitalocean.com/node-pool: symphony-ha
  orchestrator:
    resources:
      requests:
        cpu: 100m
        memory: 3Gi
      limits:
        cpu: "1"
        memory: 6Gi
    node_selector:
      doks.digitalocean.com/node-pool: symphony-control
  server:
    host: 0.0.0.0
    port: 4001
  secrets:
    references:
      - symphony-secrets
      - symphony-orchestrator-ssh
      - symphony-worker-authorized-keys
      - symphony-worker-hostkeys
      - github-machine-arrusted-symphony
      - codex-chatgpt-auth
      - cloudflare-tunnel-token
  networking:
    cloudflare_tunnel_secret: cloudflare-tunnel-token
